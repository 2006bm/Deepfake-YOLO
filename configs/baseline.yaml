# 实验1:Baseline —— YOLOv8s-seg + 原始 RGB
#
# 用途: 建立可稳定复现的基线,证明 YOLOv8-Seg 能做 Deepfake 伪造区域定位。
# 算力: RTX 3060 8GB 可跑。显存不足时按 batch 8 -> 4 -> 2 降,不必改路线。
#
# 用法:
#   yolo segment train cfg=configs/baseline.yaml
# 或直接:
#   yolo segment train model=yolov8s-seg.pt data=data/dataset_v1/dataset.yaml \
#       epochs=100 imgsz=640 batch=8 amp=True seed=0

model: yolov8s-seg.pt
data: data/dataset_v1/dataset.yaml

imgsz: 640
batch: 8
epochs: 100
patience: 20          # early stopping
amp: true             # 混合精度,3060 上省显存且更快

optimizer: AdamW
lr0: 0.001
lrf: 0.01
warmup_epochs: 3.0

# 可复现性:固定随机种子,配合 README 里记录的版本号
seed: 0
deterministic: true

# 数据增强。Deepfake 的伪造痕迹在纹理/边缘上,过强的几何变换会破坏这些线索
degrees: 0.0          # 不做旋转:旋转会引入新的边缘,污染高频特征
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# 输出
project: runs/segment
name: baseline
save_period: -1
plots: true
